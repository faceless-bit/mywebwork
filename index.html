<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>端午烟花粽子雨</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            overflow: hidden;
            background: linear-gradient(to bottom, #0a192f, #112240);
            font-family: "微软雅黑", sans-serif;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>
<canvas id="canvas"></canvas>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    // 全屏适配
    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    // 端午祝福语（15句不重复）
    const wishes = [
        "端午安康，岁岁平安",
        "粽子飘香，好运连连",
        "龙舟竞渡，前程似锦",
        "艾草青青，福气满满",
        "端午安康，万事顺遂",
        "吃粽快乐，喜乐无忧",
        "端午安康，阖家幸福",
        "粽叶飘香，端午吉祥",
        "龙舟争渡，不负韶华",
        "端午安康，四季平安",
        "粽享安康，岁岁无忧",
        "端午佳节，好运常伴",
        "艾草驱邪，平安顺遂",
        "端午安康，万事胜意",
        "粽香四溢，福气临门"
    ];

    // 烟花粒子类
    class Particle {
        constructor(x, y, color) {
            this.x = x;
            this.y = y;
            this.color = color;
            const angle = Math.random() * Math.PI * 2;
            const speed = Math.random() * 5 + 2;
            this.vx = Math.cos(angle) * speed;
            this.vy = Math.sin(angle) * speed;
            this.alpha = 1;
            this.life = 60;
        }

        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.vy += 0.15; // 重力效果，更真实
            this.alpha -= 0.02;
            this.life--;
        }

        draw() {
            ctx.globalAlpha = this.alpha;
            ctx.fillStyle = this.color;
            ctx.beginPath();
            ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    // 烟花文字类
    class Firework {
        constructor() {
            this.x = Math.random() * canvas.width;
            this.y = Math.random() * canvas.height / 2;
            this.text = wishes[Math.floor(Math.random() * wishes.length)];
            this.color = ['#ffcc00', '#ff6666', '#66ff66', '#66ccff', '#ff99ff', '#ff9933'][Math.floor(Math.random() * 6)];
            this.particles = [];
            this.life = 120;
            // 生成30个扩散粒子
            for (let i = 0; i < 30; i++) {
                this.particles.push(new Particle(this.x, this.y, this.color));
            }
        }

        update() {
            this.life--;
            this.particles.forEach(p => p.update());
        }

        draw() {
            // 文字逐渐淡去
            ctx.globalAlpha = this.life > 60 ? 1 : this.life / 60;
            ctx.fillStyle = this.color;
            ctx.font = "bold 26px 微软雅黑";
            ctx.textAlign = "center";
            ctx.fillText(this.text, this.x, this.y);
            this.particles.forEach(p => p.draw());
        }
    }

    // 粽子类（绿色三角+金色绑线，还原你之前的效果）
    class Zongzi {
        constructor() {
            this.x = Math.random() * canvas.width;
            this.y = -50;
            this.size = Math.random() * 20 + 20;
            this.speed = Math.random() * 2 + 1;
        }

        update() {
            this.y += this.speed;
        }

        draw() {
            ctx.fillStyle = "#228b22";
            ctx.strokeStyle = "#006400";
            ctx.lineWidth = 2;
            // 画粽子三角形
            ctx.beginPath();
            ctx.moveTo(this.x, this.y);
            ctx.lineTo(this.x - this.size/2, this.y + this.size);
            ctx.lineTo(this.x + this.size/2, this.y + this.size);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            // 画金色绑线
            ctx.strokeStyle = "#ffd700";
            ctx.beginPath();
            ctx.moveTo(this.x, this.y);
            ctx.lineTo(this.x, this.y + this.size);
            ctx.stroke();
        }
    }

    // 存储所有烟花和粽子
    let fireworks = [];
    let zongzis = [];

    // 主循环
    function loop() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 随机生成烟花（1.5秒一个）
        if (Math.random() < 0.015) fireworks.push(new Firework());
        // 随机生成粽子（0.5秒一个）
        if (Math.random() < 0.02) zongzis.push(new Zongzi());

        // 更新并绘制烟花
        fireworks = fireworks.filter(f => f.life > 0);
        fireworks.forEach(f => {
            f.update();
            f.draw();
        });

        // 更新并绘制粽子
        zongzis = zongzis.filter(z => z.y < canvas.height + 50);
        zongzis.forEach(z => {
            z.update();
            z.draw();
        });

        requestAnimationFrame(loop);
    }

    loop();
</script>
</body>
</html>
